<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Observer Desk – Blibli Excellent Academy Program</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%230a5ccf'/%3E%3Cpath d='M6 24C11 15 17 11 24 11s13 4 18 13c-5 9-11 13-18 13S11 33 6 24Z' fill='%23fff'/%3E%3Ccircle cx='24' cy='24' r='8.5' fill='%230a5ccf'/%3E%3Cpath d='M19.5 24.5l3.3 3.3 6-6.6' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#f5f7fb;--card:#fff;--tx:#14213d;--mut:#64708a;--bd:#e1e6f0;--pri:#0a5ccf;--pri2:#e6f0ff;--ok:#12805c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1523;--card:#182033;--tx:#e8edf8;--mut:#93a0ba;--bd:#2a3550;--pri:#5b9bff;--pri2:#1f2f50;--ok:#4cc9a0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1523;--card:#182033;--tx:#e8edf8;--mut:#93a0ba;--bd:#2a3550;--pri:#5b9bff;--pri2:#1f2f50;--ok:#4cc9a0;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--bd);background:var(--card);display:flex;align-items:center;gap:12px}header svg{flex:none}
h1{font-size:18px;margin:0}header p{margin:2px 0 0;color:var(--mut);font-size:13px}
.wrap{display:grid;grid-template-columns:270px 1fr;gap:16px;padding:16px 20px;max-width:1150px;margin:0 auto}
@media(max-width:800px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.card h2{font-size:14px;margin:0 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
input,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=number],textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
textarea{min-height:110px;resize:vertical}
button{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--bd)}
.add{display:flex;gap:6px;margin-bottom:10px}.add button{white-space:nowrap}
.tr{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.tr:hover{background:var(--pri2)}.tr.on{background:var(--pri2);border-color:var(--pri)}
.tr b{font-weight:600}.tr small{color:var(--mut);display:block}
.sc{font-weight:700;font-size:16px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
@media(max-width:560px){.sum{grid-template-columns:1fr}}
.stat{background:var(--pri2);border-radius:10px;padding:10px 12px}.stat span{font-size:12px;color:var(--mut)}.stat div{font-size:24px;font-weight:700}.stat small{color:var(--mut)}
.p{border-top:1px solid var(--bd);padding:12px 0}.p:first-of-type{border-top:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ph b{font-size:15px}.ph .n{display:flex;align-items:center;gap:6px}.ph .n input{width:80px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--bd);background:transparent;color:var(--mut);border-radius:20px;padding:3px 10px;font-size:12px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.desc{font-size:13px;color:var(--mut);background:var(--bg);border-radius:8px;padding:8px 10px}
input[type=range]{width:100%;accent-color:var(--pri)}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{background:transparent;color:var(--mut);border:1px solid var(--bd)}.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.sc-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:760px;font-size:12.5px}th,td{border:1px solid var(--bd);padding:7px 8px;text-align:left;vertical-align:top}th{background:var(--pri2)}
.empty{color:var(--mut);text-align:center;padding:30px 0}
</style>
</head>
<body>
<header><svg width="44" height="44" viewBox="0 0 48 48" role="img" aria-label="Logo Observer Desk"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2d8cff"/><stop offset="1" stop-color="#0a4bb0"/></linearGradient></defs><rect width="48" height="48" rx="12" fill="url(#lg)"/><path d="M6 24C11 15 17 11 24 11s13 4 18 13c-5 9-11 13-18 13S11 33 6 24Z" fill="#fff"/><circle cx="24" cy="24" r="8.5" fill="#0a5ccf"/><path d="M19.5 24.5l3.3 3.3 6-6.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M39 5l1.3 3.2L43.5 9.5l-3.2 1.3L39 14l-1.3-3.2L34.5 9.5l3.2-1.3z" fill="#ffc933"/></svg><div><h1>Observer Desk · Blibli Excellent Academy Program</h1><p>Lembar observasi peserta training. Data tersimpan otomatis di browser ini.</p></div></header>
<div class="wrap">
 <aside class="card">
  <h2>Peserta</h2>
  <div class="add"><input type="text" id="nm" placeholder="Nama peserta"><button id="ad">Tambah</button></div>
  <div id="list"></div>
 </aside>
 <main>
  <div class="tabs"><button id="t1" class="on">Penilaian</button><button id="t2">Rubrik</button><button id="t3">Rekap</button></div>
  <div id="v"></div>
 </main>
</div>
<script>
const MAX=100;
const BANDS=[["Sangat Kurang",0,20],["Kurang",21,40],["Cukup",41,60],["Baik",61,80],["Sangat Baik",81,100]];
const PARAMS=[
{n:"Kehadiran Tepat Waktu",d:[
"Sering terlambat atau tidak hadir tanpa kabar; kerap melewatkan sesi.",
"Terlambat cukup sering dan alasan kurang jelas; konfirmasi kehadiran tidak konsisten.",
"Hadir pada sebagian besar sesi, sesekali terlambat dengan konfirmasi.",
"Hampir selalu hadir dan tepat waktu; bila berhalangan memberi kabar lebih dulu.",
"Selalu hadir sebelum sesi dimulai, tidak pernah terlambat, siap sebelum mulai."]},
{n:"Kerapihan",d:[
"Penampilan dan perlengkapan tidak sesuai ketentuan; area kerja berantakan.",
"Sering kurang rapi atau tidak sesuai dresscode; perlu diingatkan berulang.",
"Cukup rapi dan sesuai ketentuan, sesekali ada yang terlewat.",
"Rapi dan sesuai dresscode; perlengkapan dan area kerja tertata.",
"Selalu sangat rapi dan profesional; menjadi contoh bagi peserta lain."]},
{n:"Keaktifan",d:[
"Pasif; tidak berpartisipasi dalam diskusi atau aktivitas, harus selalu ditunjuk.",
"Jarang berpartisipasi; hanya ikut bila diminta.",
"Berpartisipasi cukup, ikut aktivitas namun belum berinisiatif.",
"Aktif berdiskusi dan mengikuti aktivitas, sering berinisiatif.",
"Sangat proaktif; memimpin diskusi, memberi ide, dan menghidupkan kelas."]},
{n:"Sikap selama Training",d:[
"Tidak sopan atau mengganggu jalannya sesi; sibuk dengan gawai.",
"Kurang menghargai trainer dan peserta; fokus sering teralihkan.",
"Cukup sopan dan fokus, kadang perlu diingatkan.",
"Sopan, fokus, kooperatif, dan menghargai pendapat orang lain.",
"Sangat profesional, penuh antusias, mudah bekerja sama, menjadi teladan sikap."]},
{n:"Menjawab Pertanyaan",d:[
"Tidak mampu atau tidak mau menjawab; jawaban tidak relevan.",
"Jawaban kurang tepat, tidak runtut, dan butuh banyak arahan.",
"Jawaban cukup relevan namun kurang mendalam atau kurang jelas.",
"Jawaban tepat, runtut, dan disertai alasan atau contoh.",
"Jawaban sangat tepat, kritis, terstruktur, dan memberi wawasan tambahan."]}];
const KEY="beap_observer_v2";
let S={trainees:[],sel:null,tab:1};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const band=v=>BANDS.findIndex(b=>v>=b[1]&&v<=b[2]);
const tot=t=>t.s.reduce((a,x)=>a+(x||0),0);
const fin=t=>tot(t)/5;
const pred=f=>f<=0?"-":BANDS[Math.min(4,Math.max(0,Math.ceil(f/20)-1))][0];
const done=t=>t.s.filter(x=>x!==null).length;
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function cur(){return S.trainees.find(t=>t.id===S.sel)}
function list(){
 $("list").innerHTML=S.trainees.length?S.trainees.map(t=>`<div class="tr ${t.id===S.sel?"on":""}" data-id="${t.id}"><div><b>${esc(t.name)}</b><small>${done(t)}/5 dinilai · ${pred(fin(t))}</small></div><div class="sc">${fin(t).toFixed(1)}</div></div>`).join(""):'<div class="empty">Belum ada peserta.</div>';
 document.querySelectorAll(".tr").forEach(e=>e.onclick=()=>{S.sel=e.dataset.id;S.tab=1;save();render()});
}
function viewScore(){
 const t=cur();
 if(!t)return'<div class="card empty">Tambahkan atau pilih peserta untuk mulai menilai.</div>';
 const T=tot(t);
 let h=`<div class="card"><div class="ph" style="margin-bottom:12px"><h2 style="margin:0">${esc(t.name)}</h2><button class="ghost" id="del">Hapus peserta</button></div>
 <div class="sum"><div class="stat"><span>Total skor</span><div>${T}<small> / 500</small></div></div>
 <div class="stat"><span>Nilai rata-rata (total ÷ 5)</span><div>${fin(t).toFixed(1)}<small> / 100</small></div></div>
 <div class="stat"><span>Predikat</span><div style="font-size:18px;padding:5px 0">${pred(fin(t))}</div></div></div>`;
 PARAMS.forEach((p,i)=>{
  const v=t.s[i],b=v===null?-1:band(v);
  h+=`<div class="p"><div class="ph"><b>${i+1}. ${p.n}</b><div class="n"><input type="number" min="0" max="${MAX}" value="${v===null?"":v}" placeholder="–" data-i="${i}" class="num"><span>/ ${MAX}</span></div></div>
  <input type="range" min="0" max="${MAX}" value="${v||0}" data-i="${i}" class="rng">
  <div class="chips">${BANDS.map((x,k)=>`<button class="chip ${k===b?"on":""}" data-i="${i}" data-k="${k}">${x[0]} (${x[1]}–${x[2]})</button>`).join("")}</div>
  <div class="desc">${b<0?"Belum dinilai. Isi angka, geser slider, atau pilih kategori.":"<b>"+BANDS[b][0]+":</b> "+p.d[b]}</div></div>`;
 });
 h+=`</div><div class="card" style="margin-top:14px"><h2>Catatan observer</h2><textarea id="note" placeholder="Catatan perilaku, kekuatan, area pengembangan, kejadian penting...">${esc(t.note||"")}</textarea></div>`;
 return h;
}
function viewRubric(){
 let h=`<div class="card"><h2>Rubrik penilaian (tiap parameter maks 100, total maks 500)</h2><div class="sc-wrap"><table><tr><th>Parameter</th>${BANDS.map(b=>`<th>${b[0]}<br>${b[1]}–${b[2]}</th>`).join("")}</tr>`;
 PARAMS.forEach(p=>{h+=`<tr><th>${p.n}</th>${p.d.map(x=>`<td>${x}</td>`).join("")}</tr>`});
 return h+`</table></div><p class="desc" style="margin-top:12px">Rumus: Total = jumlah 5 parameter (maks 500). Nilai rata-rata = Total ÷ 5 (maks 100).</p></div>`;
}
function viewRekap(){
 if(!S.trainees.length)return'<div class="card empty">Belum ada data.</div>';
 const rows=[...S.trainees].sort((a,b)=>tot(b)-tot(a));
 return`<div class="card"><h2>Rekap peserta (urut nilai tertinggi)</h2><div class="sc-wrap"><table><tr><th>#</th><th>Nama</th>${PARAMS.map(p=>`<th>${p.n}</th>`).join("")}<th>Total</th><th>Rata-rata</th><th>Predikat</th></tr>${rows.map((t,i)=>`<tr><td>${i+1}</td><td>${esc(t.name)}</td>${t.s.map(x=>`<td>${x===null?"–":x}</td>`).join("")}<td>${tot(t)}</td><td><b>${fin(t).toFixed(1)}</b></td><td>${pred(fin(t))}</td></tr>`).join("")}</table></div></div>`;
}
function render(){
 ["t1","t2","t3"].forEach((id,i)=>$(id).classList.toggle("on",S.tab===i+1));
 $("v").innerHTML=S.tab===1?viewScore():S.tab===2?viewRubric():viewRekap();
 list();
 const t=cur();
 if(S.tab===1&&t){
  const set=(i,v)=>{t.s[i]=v===""||v===null?null:Math.max(0,Math.min(MAX,Math.round(+v)));save();render()};
  document.querySelectorAll(".num").forEach(e=>e.onchange=()=>set(+e.dataset.i,e.value));
  document.querySelectorAll(".rng").forEach(e=>e.onchange=()=>set(+e.dataset.i,e.value));
  document.querySelectorAll(".chip").forEach(e=>e.onclick=()=>{const b=BANDS[+e.dataset.k];set(+e.dataset.i,Math.round((b[1]+b[2])/2))});
  $("note").oninput=e=>{t.note=e.target.value;save()};
  $("del").onclick=()=>{if(confirm("Hapus "+t.name+"?")){S.trainees=S.trainees.filter(x=>x!==t);S.sel=S.trainees[0]?.id||null;save();render()}};
 }
}
function add(){const n=$("nm").value.trim();if(!n)return;const t={id:"t"+Date.now(),name:n,s:[null,null,null,null,null],note:""};S.trainees.push(t);S.sel=t.id;S.tab=1;$("nm").value="";save();render()}
$("ad").onclick=add;$("nm").onkeydown=e=>{if(e.key==="Enter")add()};
$("t1").onclick=()=>{S.tab=1;render()};$("t2").onclick=()=>{S.tab=2;render()};$("t3").onclick=()=>{S.tab=3;render()};
if(!cur())S.sel=S.trainees[0]?.id||null;
render();
</script>
</body>
</html>
